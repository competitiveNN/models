name: secrets-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (full history)
        # Scans the *entire commit history* (not just the PR diff) so a secret
        # introduced years ago is still caught when it's finally removed.
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --log-opts "--all" --no-banner --redact --exit-code=1