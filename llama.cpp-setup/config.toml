[llama]
models_path = "$HOME/data/models/gguf"
image = "localhost/llama-cpp-intel"
mode = "bench"
alias = "model"

[presets]
path = "models.ini"
# Optional: name of a section in the presets file to mark as both
# load-on-startup and default-model. The launcher generates a temp copy of the
# presets file with these two flags set, so the model is preloaded at launch
# and serves as the fallback for requests that omit the "model" field.
# default = "qwen35_08b"

[beellama]
# beellama.cpp ("bee intel") build options. These flags are beellama-only and
# will error on a plain llama.cpp image, so only set them for the bee build.
# Target KV cache types. KVarN types (kvarn2..kvarn8) are beellama-only.
# The launcher passes --kv-tail-tokens ONLY when BOTH -ctk and -ctv are
# KVarN-based (the precision tail needs a quantized/KVarN target cache to help).
# Plain llama.cpp rejects KVarN types, so this also keeps the tail off on
# non-bee images automatically.
cache_type_k = "kvarn5"
cache_type_v = "kvarn4"
# Precision tail: keep the newest N tokens exact in F16/BF16 over the KVarN
# target KV cache. 1024 is the documented balanced starting point; "auto"
# requests 1024 exact tokens per cache group (capped by context window).
kv_tail_tokens = 1024

[defaults]
n_gpu_layers = "all"
n_cpu_moe = "all"
threads = 8
ctx_size = 0
batch_size = 512
ubatch_size = 1024
reasoning_budget = false
no_mmap = true
verbosity = 3

[gpu]
devices = [
  "--device /dev/dri/card0 --device /dev/dri/renderD128",
  "--device /dev/dri/card1 --device /dev/dri/renderD129",
  "--device /dev/accel"
]

[spec]
spec_draft_max = 48
spec_draft_min = 12
spec_type = "ngram-map-k"
ngram_size_n = 24
spec_ngram_size_n = 24
spec_draft_model = ""
spec-draft-p-min = 0.8

[options]
timeout = 3600
cpu_mode = false
mtp_enabled = true
preserve_thinking = false
spec_enabled = true
fit_mode = false
