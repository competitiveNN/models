[llama]
models_path = "$HOME/data/models/gguf"
image = "localhost/llama-cpp-intel"
mode = "bench"
alias = "model"

[defaults]
model = "qwen36_27b_iq4"
n_gpu_layers = "all"
n_cpu_moe = "all"
threads = 8
ctx_size = 0
batch_size = 512
ubatch_size = 1024
reasoning_budget = false
no_mmap = true
verbosity = 3

[gpu]
devices = [
  "--device /dev/dri/card0 --device /dev/dri/renderD128",
  "--device /dev/dri/card1 --device /dev/dri/renderD129",
  "--device /dev/accel"
]

[spec]
spec_draft_max = 48
spec_draft_min = 12
spec_type = "ngram-map-k"
ngram_size_n = 24
spec_ngram_size_n = 24
spec_draft_model = ""
spec-draft-p-min = 0.8

[model_paths]

qwen35_08b = "/models/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-UD-Q4_K_XL.gguf"
qwen35_9b = "/models/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF/Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-MTP-IQ4_NL.gguf"
qwen36_35b_xs = "/models/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"
qwen36_35b_bpw_419 = "/models/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-IQ4_XS-4.19bpw.gguf"
qwen36_27b_iq4 = "/models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-i1-GGUF/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved.i1-Q4_K_S.gguf"
qwen36_35b_ream_q5 = "/models/Qwen3.6-35B-A3B-REAM-192-heretic-APEX-GGUF/Qwen3.6-35B-A3B-REAM-192-heretic-APEX-IBalanced-Q5_K_M.gguf"
ornith1_35b_q4 = "/models/Ornith-1.0-35B-MTP-APEX-GGUF/Ornith-1.0-35B-MTP-APEX-I-Compact.gguf"
kat_coder_25 = "/models/KAT-Coder-V2.5-Dev-APEX-MTP-GGUF/Kwaipilot_KAT-Coder-V2.5-Dev-APEX-MTP-I-Compact-v2D-lite.gguf"


gemma4_26b_qat = "/models/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"
gemma4_31b_qat = "/models/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-MTP/Gemma4-31B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"
gemma4_12b_qat = "/models/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"
gemma4_e2b = "/models/gemma-4-E2B-it-QAT-GGUF/gemma-4-E2B-it-QAT-Q4_0.gguf"
bonsai_27b = "/models/Ternary-Bonsai-27B-gguf/Ternary-Bonsai-27B-Q2_g64.gguf"

phi3_2b = "/models/Phi-3-mini-4k-instruct-gguf/Phi-3-mini-4k-instruct-q4.gguf"
lfm2_24b = "/models/LFM2-24B-A2B-GGUF/LFM2-24B-A2B-Q4_K_M.gguf"
lfm25_1_2b = "/models/LFM2.5-1.2B-Instruct-GGUF/LFM2.5-1.2B-Instruct-UD-Q4_K_XL.gguf"

[options]
