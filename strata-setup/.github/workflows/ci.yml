name: CI Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Mock Device Tests
        run: |
          if [ -f scripts/mock_device_test.cpp ]; then
            g++ -std=c++17 scripts/mock_device_test.cpp -o mock_device_test -lpthread
            ./mock_device_test
          else
            echo "mock_device_test.cpp not found in scripts/"
          fi

      - name: Run Deployment Checklist Check
        run: |
          if [ -f scripts/deploy-checklist.sh ]; then
            bash scripts/deploy-checklist.sh --check-only || true
          fi

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover tests

      - name: Verify Deployed Defaults Match Sweep Winner
        run: |
          python3 scripts/check_deployed_defaults.py --variance-aware

      - name: Validate Sweep Summary Schema
        run: |
          python3 scripts/check_sweep_regression.py --validate-schema

      - name: Strict Promoted Winner Regression
        run: |
          python3 scripts/check_sweep_regression.py --promoted-only --strict

      - name: Compute Variance and Confidence Intervals
        run: |
          python3 scripts/compute_variance_ci.py

      - name: Validate Provenance in Summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          summary = ROOT / "runs" / "sweep-summary.jsonl"

          if not summary.exists():
              print("Sweep summary not present; skipping provenance validation.")
              raise SystemExit(0)

          required_provenance = {"provenance", "git_commit", "image_digest"}
          ok = True
          for i, line in enumerate(summary.read_text().splitlines()):
              if not line.strip():
                  continue
              entry = json.loads(line)
              missing = required_provenance - set(entry.keys())
              if missing:
                  print(f"Line {i+1} ({entry.get('tag', '?')}): missing provenance fields: {missing}")
                  ok = False
              if entry.get("git_commit") and not isinstance(entry["git_commit"], str):
                  print(f"Line {i+1}: git_commit is not a string")
                  ok = False
              if entry.get("image_digest") and not str(entry["image_digest"]).startswith("sha256:"):
                  print(f"Line {i+1}: image_digest does not start with sha256:")
                  ok = False
          if ok:
              print("PASS: All sweep-summary.jsonl entries contain valid provenance fields.")
          else:
              print("FAIL: Provenance validation failed.")
              raise SystemExit(1)
          PY

      - name: Validate Warm-Repeat Files
        run: |
          python3 scripts/validate_warm_repeats.py

      - name: Emit Performance Regression Alert Metrics
        run: |
          python3 scripts/regression_alert.py --json-out runs/regression-alert.json
