name: CI Validation

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Run Mock Device Tests
        run: |
          if [ -f scripts/mock_device_test.cpp ]; then
            g++ -std=c++17 scripts/mock_device_test.cpp -o mock_device_test -lpthread
            ./mock_device_test
          else
            echo "mock_device_test.cpp not found in scripts/"
          fi

      - name: Run Deployment Checklist Check
        run: |
          if [ -f scripts/deploy-checklist.sh ]; then
            bash scripts/deploy-checklist.sh --check-only || true
          fi

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover tests

      - name: Verify Deployed Defaults Match Sweep Winner
        run: |
          python3 scripts/check_deployed_defaults.py --variance-aware

      - name: Validate Sweep Summary Schema
        run: |
          python3 scripts/check_sweep_regression.py --validate-schema

      - name: Strict Promoted Winner Regression
        run: |
          python3 scripts/check_sweep_regression.py --promoted-only --strict

      - name: Compute Variance and Confidence Intervals
        run: |
          python3 scripts/compute_variance_ci.py

      - name: Validate Provenance in Summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          summary = ROOT / "runs" / "sweep-summary.jsonl"

          if not summary.exists():
              print("Sweep summary not present; skipping provenance validation.")
              raise SystemExit(0)

          required_provenance = {"provenance", "git_commit", "image_digest"}
          ok = True
          for i, line in enumerate(summary.read_text().splitlines()):
              if not line.strip():
                  continue
              entry = json.loads(line)
              missing = required_provenance - set(entry.keys())
              if missing:
                  print(f"Line {i+1} ({entry.get('tag', '?')}): missing provenance fields: {missing}")
                  ok = False
              if entry.get("git_commit") and not isinstance(entry["git_commit"], str):
                  print(f"Line {i+1}: git_commit is not a string")
                  ok = False
              if entry.get("image_digest") and not str(entry["image_digest"]).startswith("sha256:"):
                  print(f"Line {i+1}: image_digest does not start with sha256:")
                  ok = False
          if ok:
              print("PASS: All sweep-summary.jsonl entries contain valid provenance fields.")
          else:
              print("FAIL: Provenance validation failed.")
              raise SystemExit(1)
          PY

      - name: Validate Warm-Repeat Files
        run: |
          python3 scripts/validate_warm_repeats.py

      - name: Emit Performance Regression Alert Metrics
        run: |
          python3 scripts/regression_alert.py --json-out runs/regression-alert.json --prometheus-out runs/regression-alert.prom

      - name: Generate Performance Trend Report
        run: |
          python3 scripts/performance_trend_report.py --history runs/regression-alert-history.jsonl --out runs/performance-trend.md --json-out runs/performance-trend.json || true

      - name: Validate Webhook Targets Config
        run: |
          python3 scripts/regression_alert.py --validate-webhooks --webhook-targets configs/webhook-targets.example.json

      - name: Validate Grafana Dashboard JSON
        run: |
          python3 -c "import json; json.load(open('grafana/strata-regression-dashboard.json')); print('Grafana dashboard JSON valid')"

      - name: Predict Performance Anomalies
        run: |
          python3 scripts/anomaly_prediction.py --history runs/regression-alert-history.jsonl --baseline-decode 11.9 --baseline-prefill 22.9 --json-out runs/anomaly-prediction.json || true

      - name: Webhook Failover Smoke
        run: |
          python3 scripts/webhook_failover.py --primary https://example.com/hook --backup https://example.org/hook --payload '{"text":"smoke"}' --dry-run

      - name: Generate Predictive Self-Healing Plan
        run: |
          python3 scripts/predictive_sweep_planner.py --max 5 --output runs/predictive-sweep-plan.json

      - name: Webhook Canary Smoke
        run: |
          python3 scripts/webhook_canary.py --primary https://example.com/p --canary https://example.com/c --payload '{"text":"smoke"}' --dry-run

      - name: Validate Sweep Plan Generation
        run: |
          python3 scripts/sweep_plan.py --max 5 --output runs/sweep-plan.json

      - name: Export Winner Configuration
        run: |
          python3 scripts/export_winner_config.py --output runs/winner-config.json

      - name: Collect Environment Profile
        run: |
          python3 scripts/collect_env_profile.py --output runs/env-profile.json

      - name: Upload Regression Alert Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-alert
          path: runs/regression-alert.json
          retention-days: 14

      - name: Upload Warm-Repeat Validation Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warm-repeat-validation
          path: runs/warm-*.json
          retention-days: 14
