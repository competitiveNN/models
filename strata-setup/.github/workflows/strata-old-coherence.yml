name: strata-old 2x B580 Coherence Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ master, main ]
    paths:
      - 'strata-old-source/**'
      - 'Containerfile.strata'
      - 'scripts/coherence.py'
      - 'bench-coherence-2xb580.py'
      - 'scripts/bench-automation.py'
      - 'Makefile'
      - 'tests/**'

jobs:
  unit-coherence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run coherence unit tests
        run: |
          python3 -m unittest discover tests -v

      - name: Validate 2x B580 configs
        run: |
          python3 scripts/validate_configs.py

      - name: Validate model weights (if model dir available)
        run: |
          if [ -d /models/swift-iq3_xxs ]; then
            python3 scripts/model_weight_validator.py --model-dir /models/swift-iq3_xxs
          else
            echo "No model directory found, skipping weight validation"
          fi
  integration-coherence:
    needs: unit-coherence
    runs-on: self-hosted  # requires 2x Intel Arc B580 + container runtime
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build strata-old image and smoke-test
        run: |
          make strata-image
          make verify-image-digest

      - name: Validate model weights
        run: |
          if [ -d /models/swift-iq3_xxs ]; then
            python3 scripts/model_weight_validator.py --model-dir /models/swift-iq3_xxs
          else
            echo "No model directory found, skipping weight validation"
          fi
      - name: Run container
        run: |
          ./run-strata-2gpu.sh
          for i in $(seq 1 60); do
            if curl -sf http://localhost:1235/health >/dev/null; then break; fi
            sleep 10
          done
          curl -sf http://localhost:1235/health

      - name: Coherence gate
        run: |
          python3 bench-coherence-2xb580.py

      - name: Stop strata container before E2E smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          podman rm -f strata 2>/dev/null || true

      - name: End-to-end image coherence smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/e2e_image_coherence_smoke.py

      - name: Benchmark regression check
        run: |
          python3 scripts/bench-automation.py --run || true
          python3 scripts/bench-automation.py --report || true

      - name: Performance and VRAM tracking
        run: |
          python3 scripts/b580_dashboard.py > runs/dashboard.md
          python3 scripts/benchmark_trend.py > runs/benchmark-trend.md
          python3 scripts/vram_balancer.py > runs/vram-report.json
          python3 scripts/b580_thermal.py > runs/thermal-metrics.prom 2>/dev/null || true
          python3 scripts/b580_prometheus.py > runs/telemetry-metrics.prom 2>/dev/null || true

      - name: Nightly soak & failover verification
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/strata_soak_test.py || true
          python3 scripts/failover_drill.py || true
          python3 scripts/b580_prometheus.py > runs/metrics.prom

      - name: Cleanup
        if: always()
        run: |
          podman rm -f strata 2>/dev/null || true
